# Sequential: parallel `stage_fixed` jobs fight over .git/index.lock.
glob_matcher: doublestar

pre-commit:
  jobs:
    - name: gitleaks
      run: gitleaks git --staged --no-banner --redact --config .gitleaks.toml
    - name: gitleaks-personal
      run: |
        f="${XDG_CONFIG_HOME:-$HOME/.config}/gitleaks/personal.toml"
        if [ -f "$f" ]; then
          gitleaks git --staged --no-banner --redact --config "$f"
        else
          echo "gitleaks-personal: $f missing, identity check skipped" >&2
        fi

    - name: nixfmt
      glob: "**/*.nix"
      stage_fixed: true
      run: nixfmt {staged_files}
    - name: deadnix
      glob: "**/*.nix"
      run: deadnix --fail {staged_files}
    - name: statix
      glob: "**/*.nix"
      run: statix check

    # update.sh has no shebang: writeShellApplication supplies it.
    - name: shfmt
      glob: "**/*.sh"
      stage_fixed: true
      run: shfmt -w -i 2 -ln bash {staged_files}
    - name: shellcheck
      glob: "**/*.sh"
      run: shellcheck -s bash {staged_files}

    - name: actionlint
      glob: ".github/workflows/*.yml"
      run: actionlint {staged_files}

    - name: nix flake check
      run: nix flake check
